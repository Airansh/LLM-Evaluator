# Frontend: stateless Next.js server, so it runs two replicas behind one Service.
# The browser calls the backend directly at NEXT_PUBLIC_API_URL, baked in at image build time
# (http://localhost:8000 by default, reached via `kubectl port-forward svc/backend 8000`).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: evalforge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: evalforge-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evalforge-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: evalforge-frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: evalforge-frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
